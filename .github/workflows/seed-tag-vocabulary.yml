name: Seed tag vocabulary

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    # Pure text embedding, no audio/ffmpeg/WARP involved — 53 tags' worth
    # of Gemini calls finishes in well under a minute normally.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: auto-tag-pip

      - name: Install Python dependencies
        run: pip install --upgrade google-genai

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/pip
          key: auto-tag-pip

      - name: Seed tag vocabulary
        run: python3 seed_vocabulary.py
        working-directory: .github/scripts/auto-tag
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EMBEDDING_WEBHOOK_SECRET: ${{ secrets.EMBEDDING_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
