name: Auto-tag

on:
  schedule:
    # Offset 3h from embedding.yml's own 0 */6 * * * — this pipeline only
    # ever processes songs whose embedding is already 'done', so running
    # after (not alongside) embedding's own schedule gives freshly-embedded
    # songs a head start rather than racing the same run.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    # Pure text-free arithmetic on already-computed vectors — no
    # audio/ffmpeg/Gemini-API work here, so this finishes in seconds even
    # for a library of several thousand songs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stage one — score songs against the tag vocabulary
        run: python3 tag_songs.py
        working-directory: .github/scripts/auto-tag
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EMBEDDING_WEBHOOK_SECRET: ${{ secrets.EMBEDDING_WEBHOOK_SECRET }}

      # Runs right after stage one within the same job, not as a separate
      # workflow: stage two only has anything new to work with once stage
      # one has actually written fresh songs.autoTags this run.
      - name: Stage two — rebuild each user's Auto-tagged playlists
        run: python3 rebuild_playlists.py
        working-directory: .github/scripts/auto-tag
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EMBEDDING_WEBHOOK_SECRET: ${{ secrets.EMBEDDING_WEBHOOK_SECRET }}
