name: Embedding

on:
  schedule:
    # 4 times a day — the retry interval for rate-limited/service-unavailable
    # jobs (see embedding_jobs' status comment in schema.ts) is this
    # interval, not an in-run backoff.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip real Gemini calls, use seeded fake embeddings (for testing the pipeline without spending API quota)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    # Well under GitHub's own 6-hour job limit and under the next scheduled
    # run — a job that somehow runs this long is stuck, not just slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # ffmpeg/ffprobe are NOT preinstalled on ubuntu-latest (confirmed via
      # a live run failing with "No such file or directory: 'ffprobe'" —
      # unlike the import pipeline's own Docker image, which bakes them in
      # explicitly, see docker/import/Dockerfile). Uses johnvansickle.com's
      # prebuilt static amd64 binaries (no apt/package-manager involvement
      # at all — a single self-contained tar.xz, same source many other CI
      # pipelines pull ffmpeg from) rather than compiling or apt-installing.
      # Cache-keyed on the file's ETag (fetched via a cheap HEAD request, not
      # the ~40MB download itself — same "resolve a cheap identifier, cache
      # on that" shape as import.yml's own digest-based image cache) so a
      # cache hit skips re-downloading entirely until upstream actually
      # publishes a new build.
      - name: Resolve ffmpeg static build ETag
        id: ffmpeg-etag
        run: |
          etag=$(curl -sI https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | grep -i '^etag:' | tr -d '"\r' | awk '{print $2}')
          echo "etag=${etag}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: ffmpeg-cache
        with:
          path: .ffmpeg-bin
          key: embedding-ffmpeg-static-${{ steps.ffmpeg-etag.outputs.etag }}

      - name: Download and extract ffmpeg static build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o ffmpeg-static.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p .ffmpeg-bin
          tar -xf ffmpeg-static.tar.xz -C .ffmpeg-bin --strip-components=1
          rm ffmpeg-static.tar.xz

      - uses: actions/cache/save@v6
        if: always() && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: .ffmpeg-bin
          key: embedding-ffmpeg-static-${{ steps.ffmpeg-etag.outputs.etag }}

      - name: Add ffmpeg to PATH
        run: echo "$GITHUB_WORKSPACE/.ffmpeg-bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: embedding-pip

      - name: Install Python dependencies
        run: pip install --upgrade google-genai

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/pip
          key: embedding-pip

      - name: Run embedding batch
        run: python3 embed.py
        working-directory: .github/scripts/embedding
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EMBEDDING_WEBHOOK_SECRET: ${{ secrets.EMBEDDING_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # schedule-triggered runs have no `inputs` context at all, so this
          # only ever evaluates true for a manual workflow_dispatch test run.
          EMBEDDING_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
