name: Build import image

on:
  push:
    branches: [main]
    paths:
      - "docker/import/**"
      - ".github/workflows/build-import-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/import
          push: true
          tags: ghcr.io/${{ github.repository }}/import:latest,ghcr.io/${{ github.repository }}/import:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
