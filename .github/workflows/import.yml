name: Import

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      source_url:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  import:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/import:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Actions replaces the image's own ENTRYPOINT with its own
      # keep-alive process for container jobs regardless of what the image
      # sets (the `--entrypoint` container.options override is explicitly
      # unsupported), so the workflow's own step below runs start.sh
      # explicitly rather than relying on any image entrypoint.
      #
      # NET_ADMIN + the TUN device are what the official WARP client needs
      # to bring up its interface even in proxy mode (no TUN traffic
      # actually flows through it in this mode, but warp-svc still requires
      # the capability to initialize). --network/--entrypoint are the only
      # container.options GitHub explicitly disallows; cap_add and devices
      # are not on that list.
      options: >-
        --cap-add=NET_ADMIN
        --device=/dev/net/tun:/dev/net/tun
        --sysctl net.ipv6.conf.all.disable_ipv6=0
        --sysctl net.ipv4.conf.all.src_valid_mark=1
    steps:
      - name: Run import
        working-directory: /import
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          IMPORT_WEBHOOK_SECRET: ${{ secrets.IMPORT_WEBHOOK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          USER_ID: ${{ inputs.user_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: /import/start.sh
