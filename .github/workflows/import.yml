name: Import

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      source_url:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      # A job-level `container:` puts every step inside the container,
      # with no way to mix in a bare-host step — and a container step
      # can't use actions/cache (it's a JS action needing a Node runtime
      # the image doesn't have). Running on the bare host and invoking
      # docker manually below, instead of via job-level `container:`,
      # keeps everything in one job: this step can use actions/cache
      # freely, and the docker run step after it mounts the result in.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: import-ytdlp-pip

      # yt-dlp breaks constantly as YouTube changes its frontend, so
      # --upgrade here is load-bearing, not optional: pip's HTTP cache
      # above only accelerates re-downloading a wheel that's already the
      # latest, it never skips checking PyPI for a newer one. Installed
      # with --target into the workspace (not baked into the image — see
      # docker/import/Dockerfile) so it can be bind-mounted into the
      # container below without needing yt-dlp inside the image at all.
      - name: Install/upgrade yt-dlp on the host
        run: pip install --upgrade --target "$GITHUB_WORKSPACE/.ytdlp-pkg" yt-dlp

      # save-always was deprecated (GitHub: "does not work as intended"),
      # so saving explicitly here instead — always, not just on a fresh
      # key, since the goal is keeping pip's cached metadata current with
      # whatever yt-dlp version was just resolved above, not merely
      # avoiding a miss once.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/pip
          key: import-ytdlp-pip

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NET_ADMIN + the TUN device are what the official WARP client needs
      # to bring up its interface even in proxy mode (no TUN traffic
      # actually flows through it in this mode, but warp-svc still requires
      # the capability to initialize). The yt-dlp package installed above
      # is bind-mounted in and put on PYTHONPATH so import.py can import it
      # without it ever being installed inside the image.
      - name: Run import
        run: |
          docker run --rm \
            --cap-add=NET_ADMIN \
            --device=/dev/net/tun:/dev/net/tun \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v "$GITHUB_WORKSPACE/.ytdlp-pkg:/ytdlp-pkg:ro" \
            -e PYTHONPATH=/ytdlp-pkg \
            -e WORKER_BASE_URL \
            -e IMPORT_WEBHOOK_SECRET \
            -e JOB_ID \
            -e USER_ID \
            -e SOURCE_URL \
            -e MINIO_ENDPOINT \
            -e MINIO_BUCKET \
            -e MINIO_ACCESS_KEY \
            -e MINIO_SECRET_KEY \
            ghcr.io/${{ github.repository }}/import:latest
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          IMPORT_WEBHOOK_SECRET: ${{ secrets.IMPORT_WEBHOOK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          USER_ID: ${{ inputs.user_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
