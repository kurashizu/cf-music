name: Import

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      source_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      # Must come first: hashFiles() below reads from the runner's working
      # directory, which is empty until checkout populates it. This file
      # itself has to be in the sparse-checkout list too — hashFiles() can
      # only see files actually on disk, and a sparse-checkout scoped to
      # just ci/import silently excluded it, so every run hashed nothing
      # and every cache key collapsed to the same "import-apt-"/
      # "import-pip-" literal (no cache invalidation, and initially no hits
      # at all since the apt cache's save step was separately broken —
      # see below).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ci/import
            .github/workflows/import.yml

      # actions/cache's restore/save steps both run as the unprivileged
      # runner user, but /var/cache/apt/archives starts out root-owned on a
      # fresh runner (nothing has run apt yet to create it as anything
      # else). A prior fix chown'd it back to the runner user only *after*
      # installs finished, which fixed saving the cache but not restoring
      # it — restore runs before that point, so every run's tar extraction
      # into this directory failed with "Permission denied" and silently
      # fell through to a full reinstall regardless of the "cache hit"
      # reported above it. Owning the directory upfront fixes both
      # directions, since nothing else needs it to be root-owned.
      - name: Prepare apt cache directory
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: import-apt-${{ hashFiles('.github/workflows/import.yml') }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: import-pip-${{ hashFiles('.github/workflows/import.yml') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg lsb-release dbus python3 python3-venv ffmpeg ca-certificates
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          # apt-get itself runs under sudo and writes new .deb files as
          # root regardless of who owns the directory, so ownership drifts
          # back to root here every run — hand it back to the runner user
          # again before the job ends so actions/cache's save step (which
          # also runs as the runner user) can read them back out.
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Install Python dependencies
        working-directory: ci/import
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install boto3 websockets
          # yt-dlp breaks constantly as YouTube changes its frontend, so
          # --upgrade here is load-bearing, not optional: pinning it to
          # whatever pip's cache happened to have would let a stale
          # extractor silently start failing every import job. pip's HTTP
          # cache (~/.cache/pip) still short-circuits re-downloading the
          # wheel when it's already the latest, so this stays fast on the
          # common case where nothing changed.
          /opt/venv/bin/pip install --upgrade yt-dlp

      - name: Run import
        working-directory: ci/import
        env:
          PATH: /opt/venv/bin:/usr/bin:/bin:/usr/sbin:/sbin
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          IMPORT_WEBHOOK_SECRET: ${{ secrets.IMPORT_WEBHOOK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          USER_ID: ${{ inputs.user_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: chmod +x start.sh && ./start.sh
