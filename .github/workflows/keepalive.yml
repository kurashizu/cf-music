name: Keepalive

# GitHub automatically disables scheduled workflows after 60 days without
# repository activity (the "will be disabled soon" email). Re-enabling a
# workflow through the API resets that timer, so this weekly job re-enables
# every scheduled workflow — itself included — and none of them ever lapses.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in embedding.yml import.yml smart-playlists.yml keepalive.yml; do
            gh workflow enable "$wf"
            echo "re-enabled $wf"
          done
