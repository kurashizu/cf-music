<!doctype html>
<!--
	Served by the service worker for any navigation the network can't answer.

	Deliberately standalone: every real route is server-rendered against the
	user's session, so none of them can be precached as HTML — offline there is
	no server to render one. This page ships as a static file, runs entirely in
	the browser, and plays what is already in the audio cache. It has no
	framework and no imports so that nothing it needs can be missing when it is
	the only thing that loads.
-->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0c090c" />
		<title>Offline · KRSZ Music</title>
		<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<style>
			:root {
				--background: oklch(0.145 0.008 326);
				--foreground: oklch(0.985 0 0);
				--card: oklch(0.212 0.019 322.12);
				--muted: oklch(0.263 0.024 320.12);
				--muted-foreground: oklch(0.711 0.019 323.02);
				--border: oklch(1 0 0 / 10%);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100svh;
				background: var(--background);
				color: var(--foreground);
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				display: flex;
				flex-direction: column;
			}
			header {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.75rem 1rem;
				border-bottom: 1px solid var(--border);
			}
			header img {
				width: 22px;
				height: 22px;
				border-radius: 4px;
			}
			header span {
				font-size: 0.875rem;
				font-weight: 500;
			}
			main {
				flex: 1;
				width: 100%;
				max-width: 42rem;
				margin: 0 auto;
				padding: 1.5rem 1rem 7rem;
			}
			h1 {
				font-size: 1.125rem;
				font-weight: 500;
				margin: 0 0 0.25rem;
			}
			.sub {
				font-size: 0.8125rem;
				color: var(--muted-foreground);
				margin: 0 0 1.5rem;
			}
			ul {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
			}
			li button {
				width: 100%;
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0.625rem 0.5rem;
				background: none;
				border: none;
				border-radius: 0.5rem;
				color: inherit;
				font: inherit;
				text-align: left;
				cursor: pointer;
			}
			li button:hover,
			li button:focus-visible {
				background: var(--muted);
			}
			li button[aria-current='true'] {
				background: var(--muted);
			}
			.idx {
				width: 1.5rem;
				flex-shrink: 0;
				text-align: right;
				font-size: 0.75rem;
				color: var(--muted-foreground);
				font-variant-numeric: tabular-nums;
			}
			.title {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 0.875rem;
			}
			.dur {
				flex-shrink: 0;
				font-size: 0.75rem;
				color: var(--muted-foreground);
				font-variant-numeric: tabular-nums;
			}
			.empty {
				border: 1px dashed var(--border);
				border-radius: 0.75rem;
				padding: 3rem 1rem;
				text-align: center;
				color: var(--muted-foreground);
				font-size: 0.875rem;
			}
			footer {
				position: fixed;
				inset: auto 0 0 0;
				border-top: 1px solid var(--border);
				background: var(--card);
				padding: 0.75rem 1rem;
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
			footer .now {
				flex: 1;
				min-width: 0;
			}
			footer .now p {
				margin: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			footer .now .t {
				font-size: 0.875rem;
				font-weight: 500;
			}
			footer .now .s {
				font-size: 0.75rem;
				color: var(--muted-foreground);
			}
			footer button {
				flex-shrink: 0;
				width: 2.25rem;
				height: 2.25rem;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: var(--muted);
				color: inherit;
				font-size: 0.875rem;
				cursor: pointer;
			}
			footer button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			.retry {
				margin-top: 1.5rem;
				padding: 0.5rem 0.875rem;
				border-radius: 0.5rem;
				border: 1px solid var(--border);
				background: none;
				color: inherit;
				font: inherit;
				font-size: 0.8125rem;
				cursor: pointer;
			}
			.retry:hover {
				background: var(--muted);
			}
		</style>
	</head>
	<body>
		<header>
			<img src="/icon-192.png" alt="" />
			<span>KRSZ Music</span>
		</header>

		<main>
			<h1>You're offline</h1>
			<p class="sub" id="sub">Looking for downloaded songs…</p>

			<ul id="list"></ul>
			<div class="empty" id="empty" hidden>
				No songs are downloaded on this device yet. Download some while you're online and they'll
				play here.
			</div>

			<button class="retry" id="retry" type="button">Try reconnecting</button>
		</main>

		<footer hidden id="bar">
			<div class="now">
				<p class="t" id="now-title"></p>
				<p class="s" id="now-sub">Playing from this device</p>
			</div>
			<button id="prev" type="button" aria-label="Previous">&#9198;</button>
			<button id="toggle" type="button" aria-label="Pause">&#10074;&#10074;</button>
			<button id="next" type="button" aria-label="Next">&#9197;</button>
		</footer>

		<script>
			// Mirrors src/lib/shared/audio-cache-key.ts. Duplicated rather than
			// imported because this page deliberately loads no modules: it has to
			// work when it is the only thing the browser could fetch.
			const AUDIO_CACHE = 'audio-v1';
			const audioKey = (videoId) => `https://audio.cf-music.internal/${videoId}`;

			const listEl = document.getElementById('list');
			const emptyEl = document.getElementById('empty');
			const subEl = document.getElementById('sub');
			const barEl = document.getElementById('bar');
			const nowTitleEl = document.getElementById('now-title');
			const toggleEl = document.getElementById('toggle');

			const audio = new Audio();
			let tracks = [];
			let currentIndex = -1;
			let objectUrl = null;

			function formatDuration(seconds) {
				if (typeof seconds !== 'number' || !isFinite(seconds) || seconds < 0) return '';
				const m = Math.floor(seconds / 60);
				const s = Math.floor(seconds % 60);
				return `${m}:${String(s).padStart(2, '0')}`;
			}

			/** Asks the service worker what it has, falling back to reading the cache directly. */
			async function loadTracks() {
				const viaWorker = await new Promise((resolve) => {
					if (!navigator.serviceWorker?.controller) return resolve(null);
					const channel = new MessageChannel();
					const timer = setTimeout(() => resolve(null), 3000);
					channel.port1.onmessage = (event) => {
						clearTimeout(timer);
						resolve(event.data?.tracks ?? null);
					};
					navigator.serviceWorker.controller.postMessage({ type: 'LIST_CACHED_TRACKS' }, [
						channel.port2
					]);
				});
				if (viaWorker) return viaWorker;

				// No controller yet (a hard reload can land here before the worker
				// claims the page), so read the same caches the worker would.
				try {
					const cache = await caches.open(AUDIO_CACHE);
					const ids = (await cache.keys()).map((r) => r.url.split('/').pop()).filter(Boolean);
					const meta = await caches.open('audio-meta-v1');
					return await Promise.all(
						ids.map(async (videoId) => {
							const hit = await meta.match(`https://meta.cf-music.internal/${videoId}`);
							return hit ? hit.json() : { videoId, title: videoId, durationSeconds: null };
						})
					);
				} catch {
					return [];
				}
			}

			function render() {
				listEl.textContent = '';
				tracks.forEach((track, index) => {
					const li = document.createElement('li');
					const button = document.createElement('button');
					button.type = 'button';
					button.addEventListener('click', () => play(index));

					const idx = document.createElement('span');
					idx.className = 'idx';
					idx.textContent = String(index + 1);

					const title = document.createElement('span');
					title.className = 'title';
					title.textContent = track.title || track.videoId;

					const dur = document.createElement('span');
					dur.className = 'dur';
					dur.textContent = formatDuration(track.durationSeconds);

					button.append(idx, title, dur);
					li.append(button);
					listEl.append(li);
				});
			}

			function markCurrent() {
				[...listEl.querySelectorAll('button')].forEach((button, index) => {
					button.setAttribute('aria-current', String(index === currentIndex));
				});
			}

			async function play(index) {
				const track = tracks[index];
				if (!track) return;
				if (index === currentIndex && audio.src) {
					void togglePlayPause();
					return;
				}
				const cache = await caches.open(AUDIO_CACHE);
				const hit = await cache.match(audioKey(track.videoId));
				if (!hit) return;

				// A blob URL, not the cache key: that key is a lookup handle the
				// service worker invents and nothing can actually fetch.
				if (objectUrl) URL.revokeObjectURL(objectUrl);
				objectUrl = URL.createObjectURL(await hit.blob());
				audio.src = objectUrl;
				currentIndex = index;
				nowTitleEl.textContent = track.title || track.videoId;
				barEl.hidden = false;
				publishToOs(track);
				markCurrent();
				await audio.play().catch(() => {});
			}

			async function togglePlayPause() {
				if (audio.paused) await audio.play().catch(() => {});
				else audio.pause();
			}

			function step(delta) {
				if (tracks.length === 0) return;
				const next = currentIndex + delta;
				if (next < 0 || next >= tracks.length) return;
				void play(next);
			}

			// The same OS integration the main app has, so a phone playing from
			// this page still shows the track in its notification shade with
			// working buttons — the whole point of offline playback is that it
			// happens with the screen off.
			function publishToOs(track) {
				if (!('mediaSession' in navigator)) return;
				try {
					navigator.mediaSession.metadata = new MediaMetadata({
						title: track.title || track.videoId,
						artist: 'Downloaded on this device'
					});
				} catch {}
			}

			function bindOsControls() {
				if (!('mediaSession' in navigator)) return;
				const actions = [
					['play', () => void audio.play().catch(() => {})],
					['pause', () => audio.pause()],
					['previoustrack', () => step(-1)],
					['nexttrack', () => step(1)],
					['stop', () => audio.pause()]
				];
				for (const [action, handler] of actions) {
					try {
						navigator.mediaSession.setActionHandler(action, handler);
					} catch {}
				}
			}

			function setOsState(state) {
				if ('mediaSession' in navigator) navigator.mediaSession.playbackState = state;
			}

			audio.addEventListener('play', () => {
				toggleEl.innerHTML = '&#10074;&#10074;';
				toggleEl.setAttribute('aria-label', 'Pause');
				setOsState('playing');
			});
			audio.addEventListener('pause', () => {
				toggleEl.innerHTML = '&#9205;';
				toggleEl.setAttribute('aria-label', 'Play');
				setOsState('paused');
			});
			audio.addEventListener('ended', () => step(1));
			bindOsControls();

			toggleEl.addEventListener('click', () => void togglePlayPause());
			document.getElementById('next').addEventListener('click', () => step(1));
			document.getElementById('prev').addEventListener('click', () => step(-1));
			document.getElementById('retry').addEventListener('click', () => {
				location.href = '/';
			});

			// Back to the real app as soon as there is a network again, but only
			// while nothing is playing — yanking the page out from under a song
			// the reader is listening to would be worse than staying put.
			window.addEventListener('online', () => {
				if (audio.paused) location.href = '/';
			});

			loadTracks().then((found) => {
				tracks = Array.isArray(found) ? found : [];
				if (tracks.length === 0) {
					subEl.textContent = 'Nothing is downloaded on this device.';
					emptyEl.hidden = false;
					return;
				}
				subEl.textContent =
					tracks.length === 1
						? '1 downloaded song is available.'
						: `${tracks.length} downloaded songs are available.`;
				render();
			});
		</script>
	</body>
</html>
